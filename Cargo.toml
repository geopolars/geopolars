[workspace]
members = ["geopolars/geopolars-arrow"]
exclude = ["py-geopolars", "wasm-geopolars"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.4"
authors = ["Kyle Barron <kylebarron2@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geopolars/geopolars"
rust-version = "1.85"
categories = ["science::geo"]

[workspace.dependencies]
arrow-array = "57"
arrow-buffer = "57"
arrow-data = "57"
arrow-schema = "57"
polars-arrow = "0.52"
